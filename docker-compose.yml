# Every ${VAR:-default} carries a working dev default, except APP_ENCRYPTION_KEY: a key in git
# would encrypt nothing. ./start.sh writes a real .env from .env.example and generates that key
# into it, so run ./start.sh once before a plain `docker compose up`. Override anything in .env.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iloveshopping}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-iloveshopping}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  # Stripe's payment events and the order emails go through queues here, each with a dead letter queue
  # (backend config/MessagingConfig). The management page shows the queues; the shovel plugin adds
  # "Move messages", to send a dead-lettered message back once its problem is fixed.
  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    ports:
      # the management page only; the backend reaches AMQP on the compose network
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/iloveshopping}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-noreply@iloveshopping.local}
      SUPPORT_INBOX: ${SUPPORT_INBOX:-support@iloveshopping.local}
      FRONTEND_RESET_URL: ${FRONTEND_RESET_URL:-https://localhost:5443/reset}
      # where the links in order emails point
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:5443}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://app:changeme@rabbitmq:5672}
      # AES-256 key for the encrypted order and payment columns. Required: start.sh generates it.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?run ./start.sh once, it writes a random encryption key into .env}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-at-least-32-bytes-long}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-false}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_HOSTNAME: ${RECAPTCHA_HOSTNAME:-}
      # The app is served over HTTPS (nginx redirects plain http), so the refresh cookie is Secure:
      # the browser never sends it over an unencrypted connection. Set false only for an http-only setup.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-i-love-shopping}
      # Stripe test mode. Without the keys the shop runs, and placing an order says payments are unavailable.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ORDER_PAYMENT_HOLD: ${ORDER_PAYMENT_HOLD:-PT30M}
    ports:
      # Loopback only. Tomcat trusts X-Real-IP from private addresses, so a backend reachable from
      # the LAN would let any client choose its own address and step around the per-IP rate limits.
      # Other devices use nginx on FRONTEND_PORT, which overwrites that header.
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - product_images_data:/var/app/images

  frontend:
    build:
      context: ./frontend
      args:
        # The same Google client and reCAPTCHA keypair the backend verifies against; both are public.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
        # Stripe's publishable key (pk_test_...) is public by design; the secret key stays with the backend.
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    environment:
      # the public HTTPS port, so plain http on FRONTEND_PORT can redirect to it
      HTTPS_PORT: ${FRONTEND_HTTPS_PORT:-5443}
    ports:
      # plain http only redirects to https
      - "${FRONTEND_PORT:-5173}:80"
      - "${FRONTEND_HTTPS_PORT:-5443}:443"
    depends_on:
      - backend
    volumes:
      # nginx serves product images straight off the volume the backend writes to.
      - product_images_data:/var/app/images:ro
      # the self-signed certificate made on first start, kept so the browser's exception stays valid
      - tls_data:/etc/nginx/tls

  # The payment simulation CLI, in a container so Docker stays the only thing to install. It logs in
  # with the test secret key and forwards Stripe's test-mode events to the backend's webhook. Without a
  # key it exits at once and the rest of the stack runs on; start.sh writes its signing secret into .env.
  stripe-cli:
    image: stripe/stripe-cli:v1.50.11
    command: ["listen", "--forward-to", "http://backend:8080/payments/webhook",
              "--events", "payment_intent.succeeded,payment_intent.payment_failed,charge.refunded"]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  product_images_data:
  tls_data:
