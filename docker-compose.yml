# Every ${VAR:-default} carries a working dev default, so `docker compose up --build`
# brings the stack online on a fresh clone with no .env present. ./start.sh writes a
# real .env from .env.example; override anything there.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iloveshopping}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-iloveshopping}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/iloveshopping}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-noreply@iloveshopping.local}
      FRONTEND_RESET_URL: ${FRONTEND_RESET_URL:-http://localhost:5173/reset}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-at-least-32-bytes-long}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-false}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_HOSTNAME: ${RECAPTCHA_HOSTNAME:-}
      # Dev runs over plain http, including from other devices on the LAN, where a Secure
      # cookie would be dropped silently. Production leaves this unset: the default is true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-i-love-shopping}
    ports:
      # Loopback only. Tomcat trusts X-Real-IP from private addresses, so a backend reachable from
      # the LAN would let any client choose its own address and step around the per-IP rate limits.
      # Other devices use nginx on FRONTEND_PORT, which overwrites that header.
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - product_images_data:/var/app/images

  frontend:
    build:
      context: ./frontend
      args:
        # The same Google client and reCAPTCHA keypair the backend verifies against; both are public.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    volumes:
      # nginx serves product images straight off the volume the backend writes to.
      - product_images_data:/var/app/images:ro

volumes:
  postgres_data:
  redis_data:
  product_images_data:
