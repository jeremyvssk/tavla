spring:
  application:
    name: i-love-shopping-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    # db/seed holds the repeatable demo catalog; a production deploy sets FLYWAY_LOCATIONS without it.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
    baseline-on-migrate: false

  data:
    redis:
      url: ${REDIS_URL}

  # Stripe's payment events and the order emails each go through a queue (config/MessagingConfig).
  rabbitmq:
    addresses: ${RABBITMQ_URL}
    # The webhook waits for the broker's confirm before answering Stripe (PaymentEventPublisher).
    publisher-confirm-type: simple
    listener:
      simple:
        # One consumer per queue: events are applied in the order they arrive, and there are few of them.
        # More would be safe too: every status change takes a row lock on its order.
        concurrency: 1
        # After the last retry a message is rejected, never put back at the head of the queue to loop
        # forever: RabbitMQ moves it to the queue's dead letter queue.
        default-requeue-rejected: false
        retry:
          enabled: true
          # 3 tries in all, 1 s then 2 s apart, before the message is parked in the dead letter queue
          max-retries: 2
          initial-interval: 1s
          multiplier: 2

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080
  # Behind nginx every request arrives from the proxy's address. Tomcat's RemoteIpValve swaps in
  # the client address from X-Real-IP, which nginx sets (overwriting anything the client sent), so
  # rate limits count real clients. Only honoured when the direct peer is a private address.
  forward-headers-strategy: native
  tomcat:
    max-http-form-post-size: 1MB
    remoteip:
      remote-ip-header: X-Real-IP

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
  refresh-token:
    ttl: ${JWT_REFRESH_TTL:P7D}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
  mail:
    from: ${MAIL_FROM:noreply@iloveshopping.local}
  frontend:
    reset-url: ${FRONTEND_RESET_URL:http://localhost:5173/reset}
    # Where the links in order emails point.
    base-url: ${FRONTEND_URL:https://localhost:5443}
  cookie:
    secure: ${COOKIE_SECURE:true}
  recaptcha:
    enabled: ${RECAPTCHA_ENABLED:false}
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    verify-url: https://www.google.com/recaptcha/api/siteverify
    # Blank disables the check; set it to the domain the widget is served from.
    expected-hostname: ${RECAPTCHA_HOSTNAME:}
  rate-limit:
    # Integration tests switch this off: they share one Redis and all arrive from 127.0.0.1.
    enabled: ${RATE_LIMIT_ENABLED:true}
  two-factor:
    issuer: ${TWO_FACTOR_ISSUER:i-love-shopping}
  cart:
    # A guest cart and its cookie live this long after the last change; GuestCartCleanup deletes older ones.
    guest-ttl: ${CART_GUEST_TTL:P30D}
  orders:
    # How long an unpaid order keeps its stock reserved; OrderExpiry puts it back on sale after this.
    payment-hold: ${ORDER_PAYMENT_HOLD:PT30M}
    # The shop's days, for the order list's date filter and the times in emails.
    time-zone: ${SHOP_TIME_ZONE:Europe/Tallinn}
  # AES-256 key for the encrypted order and payment columns (crypto/FieldCipher): 32 random bytes,
  # base64. No default on purpose: start.sh generates one into .env. A key in git encrypts nothing.
  encryption:
    key: ${APP_ENCRYPTION_KEY}
  stripe:
    # Test-mode secret key (sk_test_...). Blank: placing an order answers 503 and nothing is reserved.
    secret-key: ${STRIPE_SECRET_KEY:}
    # The whsec_... that `stripe listen` prints; start.sh fills it in. Blank: every webhook is refused.
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: eur
  storage:
    # The product_images_data volume; nginx serves the same directory at /images.
    images-dir: ${IMAGES_DIR:/var/app/images}
    public-prefix: /images
