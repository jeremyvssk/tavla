# Single origin for the whole app: nginx serves the SPA bundle, proxies the API to the
# backend container, and serves product images off the shared volume. Same-origin means
# no CORS and no cross-origin credential sharing anywhere in the stack.
#
# A template: the nginx image fills in ${HTTPS_PORT} from the environment at start, and leaves
# nginx's own $variables alone.

# Plain http only sends the browser to https. Nothing, not even a login form, is served unencrypted.
server {
    listen 80;
    server_name _;
    return 301 https://$host:${HTTPS_PORT}$request_uri;
}

# Everything else is HTTPS: TLS 1.2 or 1.3 only. The certificate is self-signed for localhost
# (made on first start by 15-self-signed-cert.sh), so the browser warns once; a real deployment
# puts a CA-signed certificate in the same two files. No HSTS header: browsers apply it to every
# port of a host, and pinning localhost to https would break other local dev servers.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Mirrors spring.servlet.multipart.max-file-size so oversized uploads die at the edge.
    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    # Product images the backend wrote to the product_images_data volume.
    # attachment + nosniff so an image that is secretly HTML/SVG can never execute
    # in this origin (backend/CLAUDE.md section 7).
    location /images/ {
        alias /var/app/images/;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 7d;
        access_log off;
    }

    # API. Paths are proxied VERBATIM, never rewritten: the refresh cookie is scoped
    # Path=/auth (AuthController.COOKIE_PATH), so a /api prefix would stop the browser
    # from ever sending it back. Add new backend domain prefixes to this alternation.
    location ~ ^/(auth|users|products|categories|brands|search|cart|orders|payments)(/|$) {
        # Resolve via Docker's embedded DNS at request time, so a backend restart
        # doesn't leave nginx holding a stale IP or refusing to start.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream backend;
        proxy_pass http://$upstream:8080$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback. Without this every deep link 404s on refresh — including /reset,
    # which is the URL the password-reset email points at.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
