spring:
  application:
    name: i-love-shopping-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    # db/seed holds the repeatable demo catalog; a production deploy sets FLYWAY_LOCATIONS without it.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
    baseline-on-migrate: false

  data:
    redis:
      url: ${REDIS_URL}

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080
  # Behind nginx every request arrives from the proxy's address. Tomcat's RemoteIpValve swaps in
  # the client address from X-Real-IP, which nginx sets (overwriting anything the client sent), so
  # rate limits count real clients. Only honoured when the direct peer is a private address.
  forward-headers-strategy: native
  tomcat:
    max-http-form-post-size: 1MB
    remoteip:
      remote-ip-header: X-Real-IP

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
  refresh-token:
    ttl: ${JWT_REFRESH_TTL:P7D}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
  mail:
    from: ${MAIL_FROM:noreply@iloveshopping.local}
  frontend:
    reset-url: ${FRONTEND_RESET_URL:http://localhost:5173/reset}
  cookie:
    secure: ${COOKIE_SECURE:true}
  recaptcha:
    enabled: ${RECAPTCHA_ENABLED:false}
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    verify-url: https://www.google.com/recaptcha/api/siteverify
    # Blank disables the check; set it to the domain the widget is served from.
    expected-hostname: ${RECAPTCHA_HOSTNAME:}
  rate-limit:
    # Integration tests switch this off: they share one Redis and all arrive from 127.0.0.1.
    enabled: ${RATE_LIMIT_ENABLED:true}
  two-factor:
    issuer: ${TWO_FACTOR_ISSUER:i-love-shopping}
  storage:
    # The product_images_data volume; nginx serves the same directory at /images.
    images-dir: ${IMAGES_DIR:/var/app/images}
    public-prefix: /images
